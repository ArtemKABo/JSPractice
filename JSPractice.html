<script>

    function loadNewStyle(src){
		return new Promise(function(resolve, reject){
			let link = document.createElement('link');
			link.href = src;
            link.rel="stylesheet";

			link.onload = () => resolve(null, link);
			link.onerror = () => reject(new Error(`:link download error! ${src}`));

			document.head.append(link);
		})
	}

	let stpromise = loadNewStyle('styles.css');

	stpromise.catch(alert);

	function loadNewScript(src){
		return new Promise(function(resolve, reject){
			let script = document.createElement('script');
			script.src = src;

			script.onload = () => resolve(null, script);
			script.onerror = () => reject(new Error(`Script download error! ${src}`));

			document.head.append(script);
		})
	}

	let promise = loadNewScript('scripts.js');

	promise.catch(alert);

</script>
